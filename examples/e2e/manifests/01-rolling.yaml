apiVersion: andro-cd/v1
kind: ECSService
metadata:
  name: e2e-01-rolling
  labels: {suite: e2e, scenario: rolling}
spec:
  cluster: ${cluster}
  region: ${region}
  network:
    subnets:
      - ${subnet_a}
      - ${subnet_b}
    securityGroups:
      - ${security_group}
  service:
    desiredCount: 1
    assignPublicIp: true
  taskDefinition:
    cpu: "256"
    memory: "512"
    executionRoleArn: ${execution_role}
    containers:
      - name: web
        image: nginx:1.27
        portMappings: [80]
        logGroup: /ecs/e2e-01-rolling
