apiVersion: andro-cd/v1
kind: ECSService
metadata:
  name: e2e-06-canary
  labels: {suite: e2e, scenario: canary}
spec:
  cluster: ${cluster}
  region: ${region}
  network:
    subnets:
      - ${subnet_a}
      - ${subnet_b}
    securityGroups:
      - ${security_group}
  service:
    desiredCount: 4
    assignPublicIp: true
    loadBalancer:
      containerName: web
      containerPort: 80
      targetGroupArn: ${blue_tg}
      alternateTargetGroupArn: ${green_tg}
      productionListenerRule: ${production_rule}
      testListenerRule: ${test_rule}       # dark canary — hit the green fleet before flip
      roleArn: ${elb_bg_role}
    deploymentStrategy:
      type: CANARY
      canaryPercent: 10
      canaryBakeTimeMinutes: 3
      bakeTimeMinutes: 3
      alarms:
        alarmNames:
          - ${rollback_alarm}
        rollback: true
        enable: true
      lifecycleHooks:
        - targetType: AWS_LAMBDA
          hookTargetArn: ${canary_hook_lambda}
          roleArn: ${hook_role}
          stages: [POST_TEST_TRAFFIC_SHIFT]
          timeoutMinutes: 5
          timeoutAction: ROLLBACK
  taskDefinition:
    cpu: "256"
    memory: "512"
    executionRoleArn: ${execution_role}
    containers:
      - name: web
        image: nginx:1.27
        portMappings: [80]
        logGroup: /ecs/e2e-06-canary
