apiVersion: andro-cd/v1
kind: ECSService
metadata:
  name: e2e-04-service-connect
  labels: {suite: e2e, scenario: service-connect}
spec:
  cluster: ${cluster}
  region: ${region}
  network:
    subnets: [${subnet_a}, ${subnet_b}]
    securityGroups: [${security_group}]
  service:
    desiredCount: 1
    assignPublicIp: true
    serviceConnect:
      enabled: true
      namespace: ${sc_namespace}
      services:
        - portName: http
          discoveryName: e2e-04
          clientAliases:
            - port: 8080
              dnsName: e2e-04
  taskDefinition:
    cpu: "256"
    memory: "512"
    executionRoleArn: ${execution_role}
    containers:
      - name: web
        image: nginx:1.27
        portMappings:
          - containerPort: 80
            name: http
            protocol: tcp
        logGroup: /ecs/e2e-04-service-connect
